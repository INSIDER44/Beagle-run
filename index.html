<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beagle Run - Double Trouble</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1a1a1a; overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: sans-serif; }
        canvas { display: block; background: #87CEEB; touch-action: none; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; }
        #ui-overlay { position: absolute; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.85); color: white; z-index: 20; pointer-events: none; }
        #leaderboard { margin: 15px 0; background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 12px; width: 280px; border: 1px solid rgba(255, 255, 255, 0.2); pointer-events: auto; }
        .score-row { display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 16px; }
        .current-player { background: rgba(255, 215, 0, 0.3) !important; border: 1px solid #ffd700; border-radius: 5px; }
        .btn-play { margin-top: 15px; padding: 15px 40px; background: #ffd700; color: black; border-radius: 10px; font-weight: bold; font-size: 20px; pointer-events: auto; cursor: pointer; border: none; }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <h1 style="color:#ff4d4d; margin:0; font-size: 40px;">GAME OVER</h1>
        <p id="final-score" style="font-size:24px; margin:10px 0;">Score: 0</p>
        <div id="leaderboard">
            <div style="font-weight:bold; text-align:center; color:#ffd700; margin-bottom:10px; font-size: 18px;">🏆 GLOBAL TOP 20</div>
            <div id="leaderboard-list"></div>
        </div>
        <button class="btn-play" onclick="restartGame()">PLAY AGAIN</button>
    </div>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('ui-overlay');
        const list = document.getElementById('leaderboard-list');

        canvas.width = 1280; canvas.height = 720;
        
        const imgDog = new Image(); imgDog.src = '1124-removebg-preview.png';
        const imgCat = new Image(); imgCat.src = '1126-removebg-preview.png';
        const imgBone = new Image(); imgBone.src = '1127-removebg-preview.png';
        const imgHouse = new Image(); imgHouse.src = '1128-removebg-preview.png';
        const imgCloud = new Image(); imgCloud.src = '1176-removebg-preview.png';

        let score = 0, highScore = localStorage.getItem('beagleBest') || 0;
        let gameSpeed = 8.5, isGameOver = false, isWaiting = true;
        let spawnTimer = 0, playerName = localStorage.getItem('beagleUserName') || "BeagleOli";
        let dog = { x: 150, y: 0, w: 125, h: 125, dy: 0, jump: 26, grounded: false };
        let obstacles = [], bones = [], clouds = [];

        for(let i=0; i<5; i++) clouds.push({ x: Math.random()*canvas.width, y: Math.random()*180, w: 160, h: 100, speed: 0.5 + Math.random() });

        function updateLeaderboard() {
            if (score > highScore) { highScore = score; localStorage.setItem('beagleBest', highScore); }
            let leaders = JSON.parse(localStorage.getItem('beagleGlobalTops')) || [];
            let me = leaders.find(l => l.username === playerName);
            if (me) { if (score > me.score) me.score = score; } 
            else { leaders.push({ username: playerName, score: score }); }
            leaders.sort((a,b) => b.score - a.score);
            leaders = leaders.slice(0, 20);
            localStorage.setItem('beagleGlobalTops', JSON.stringify(leaders));

            list.innerHTML = leaders.map((l, i) => `
                <div class="score-row ${l.username === playerName ? 'current-player' : ''}">
                    <span>#${i+1} ${l.username}</span>
                    <span style="font-weight:bold;">${l.score} 🦴</span>
                </div>
            `).join('');
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const groundY = canvas.height * 0.85;

            clouds.forEach(c => {
                c.x -= c.speed;
                ctx.drawImage(imgCloud, c.x, c.y, c.w, c.h);
                if (c.x + c.w < 0) c.x = canvas.width;
            });
            ctx.fillStyle = '#458B00';
            ctx.fillRect(0, groundY, canvas.width, canvas.height * 0.15);

            if (isWaiting) {
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white"; ctx.textAlign = "center";
                ctx.font = "bold 50px sans-serif";
                ctx.fillText(`READY, ${playerName.toUpperCase()}?`, canvas.width/2, 340);
                ctx.font = "30px sans-serif";
                ctx.fillText("TAP TO START", canvas.width/2, 400);
            } else if (!isGameOver) {
                dog.dy += 1.45; dog.y += dog.dy;
                if (dog.y + dog.h > groundY + 20) { dog.y = groundY + 20 - dog.h; dog.dy = 0; dog.grounded = true; }
                ctx.drawImage(imgDog, dog.x, dog.y, dog.w, dog.h);

                spawnTimer++;
                // Велика дистанція між РІЗНИМИ перешкодами для стабільності
                let groupGap = 90;
                
                if (spawnTimer > groupGap) {
                    let type = Math.random() > 0.5 ? 'cat' : 'house';
                    obstacles.push({ x: canvas.width, y: groundY - 85, w: 100, h: 100, type: type });
                    
                    // ПОДВІЙНІ ОБ'ЄКТИ: тепер вони стоять поруч (85px відстані при ширині 100px)
                    // Це створює ефект одного довгого об'єкта
                    if (Math.random() < 0.32) {
                        obstacles.push({ x: canvas.width + 85, y: groundY - 85, w: 100, h: 100, type: type });
                    }
                    
                    spawnTimer = 0;
                    if (Math.random() > 0.4) bones.push({ x: canvas.width + 250, y: 350, w: 60, h: 40 });
                }

                obstacles.forEach((o, i) => {
                    o.x -= gameSpeed;
                    ctx.drawImage(o.type === 'cat' ? imgCat : imgHouse, o.x, o.y, o.w, o.h);
                    if (dog.x + 55 < o.x + 55 && dog.x + 70 > o.x + 30 && dog.y + 50 < o.y + 65 && dog.y + 80 > o.y + 30) {
                        isGameOver = true;
                        document.getElementById('final-score').innerText = "Your Score: " + score;
                        updateLeaderboard();
                        overlay.style.display = 'flex';
                    }
                });
                obstacles = obstacles.filter(o => o.x > -200);

                bones.forEach((b, i) => {
                    b.x -= gameSpeed;
                    ctx.drawImage(imgBone, b.x, b.y, b.w, b.h);
                    if (dog.x < b.x + b.w && dog.x + dog.w > b.x && dog.y < b.y + b.h && dog.y + dog.h > b.y) {
                        score++; bones.splice(i, 1);
                    }
                });
                bones = bones.filter(b => b.x > -100);

                ctx.fillStyle = "white"; ctx.font = "bold 35px sans-serif"; ctx.textAlign = "left";
                ctx.fillText(`Bones: ${score}`, 40, 60);
                ctx.textAlign = "right"; ctx.fillText(`Best: ${highScore}`, canvas.width - 40, 60);
            }
            requestAnimationFrame(gameLoop);
        }

        function restartGame() {
            score = 0; obstacles = []; bones = []; dog.y = 0; 
            isGameOver = false; isWaiting = false;
            overlay.style.display = 'none';
        }

        function handleInput(e) {
            if (isWaiting) { isWaiting = false; }
            else if (!isGameOver && dog.grounded) {
                dog.dy = -dog.jump; dog.grounded = false;
            }
        }

        window.addEventListener('touchstart', (e) => { if(!isGameOver && e.target.tagName !== 'BUTTON') { e.preventDefault(); handleInput(); } }, { passive: false });
        window.addEventListener('mousedown', (e) => { if(!isGameOver && e.target.tagName !== 'BUTTON') handleInput(); });
        gameLoop();
    </script>
</body>
</html>
