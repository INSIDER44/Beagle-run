<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beagle Run</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #87CEEB; font-family: 'Arial', sans-serif; touch-action: manipulation; }
        canvas { display: block; background: #90EE90; border-bottom: 15px solid #556B2F; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">Bones: 0</div>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('ui');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Зображення
        const imgDog = new Image(); imgDog.src = 'http://googleusercontent.com/image_collection/image_retrieval/8151202598106743683_0';
        const imgCat = new Image(); imgCat.src = 'http://googleusercontent.com/image_collection/image_retrieval/1076865895012453512_0';
        const imgBone = new Image(); imgBone.src = 'http://googleusercontent.com/image_collection/image_retrieval/1705889547215306897_0';
        const imgHouse = new Image(); imgHouse.src = 'http://googleusercontent.com/image_collection/image_retrieval/3675021078423746476_0';

        let score = 0;
        let gameSpeed = 5;
        let isGameOver = false;
        const gravity = 0.6;

        const dog = {
            x: 50,
            y: canvas.height - 150,
            w: 70,
            h: 70,
            dy: 0,
            jumpForce: 13,
            grounded: false
        };

        const obstacles = [];
        const bones = [];

        function spawnObstacle() {
            if (isGameOver) return;
            const type = Math.random() > 0.5 ? 'cat' : 'house';
            obstacles.push({
                x: canvas.width,
                y: canvas.height - 110,
                w: 60,
                h: 60,
                type: type
            });
            // Наступна перешкода через рандомний час
            setTimeout(spawnObstacle, 1500 + Math.random() * 2000 / (gameSpeed/5));
        }

        function spawnBone() {
            if (isGameOver) return;
            bones.push({
                x: canvas.width,
                y: canvas.height - 150 - Math.random() * 100,
                w: 40,
                h: 30
            });
            setTimeout(spawnBone, 1000 + Math.random() * 1000);
        }

        function update() {
            if (isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Логіка стрибка
            dog.dy += gravity;
            dog.y += dog.dy;

            if (dog.y + dog.h > canvas.height - 20) {
                dog.y = canvas.height - 20 - dog.h;
                dog.dy = 0;
                dog.grounded = true;
            }

            // Малюємо Бігля
            ctx.drawImage(imgDog, dog.x, dog.y, dog.w, dog.h);

            // Перешкоди (Коти та Будки)
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;
                
                const currentImg = obs.type === 'cat' ? imgCat : imgHouse;
                ctx.drawImage(currentImg, obs.x, obs.y, obs.w, obs.h);

                // Перевірка зіткнення (Collision)
                if (dog.x < obs.x + obs.w - 10 && dog.x + dog.w > obs.x + 10 && 
                    dog.y < obs.y + obs.h - 10 && dog.y + dog.h > obs.y + 10) {
                    isGameOver = true;
                    alert("Гав! Гра закінчена. Твій результат: " + score);
                    location.reload();
                }

                if (obs.x + obs.w < 0) obstacles.splice(i, 1);
            }

            // Кісточки
            for (let i = bones.length - 1; i >= 0; i--) {
                let b = bones[i];
                b.x -= gameSpeed;
                ctx.drawImage(imgBone, b.x, b.y, b.w, b.h);

                if (dog.x < b.x + b.w && dog.x + dog.w > b.x && 
                    dog.y < b.y + b.h && dog.y + dog.h > b.y) {
                    score++;
                    scoreElement.innerText = "Bones: " + score;
                    bones.splice(i, 1);
                }

                if (b.x + b.w < 0) bones.splice(i, 1);
            }

            gameSpeed += 0.002; // Поступове прискорення
            requestAnimationFrame(update);
        }

        // Керування тапом
        window.addEventListener('touchstart', (e) => {
            if (dog.grounded) {
                dog.dy = -dog.jumpForce;
                dog.grounded = false;
            }
        });
        
        // Для тесту на комп'ютері (клік мишкою)
        window.addEventListener('mousedown', () => {
            if (dog.grounded) {
                dog.dy = -dog.jumpForce;
                dog.grounded = false;
            }
        });

        // Запуск
        spawnObstacle();
        spawnBone();
        update();
    </script>
</body>
</html>
