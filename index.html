<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beagle Run - Working Version</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #87CEEB; touch-action: manipulation; }
        canvas { display: block; background: #87CEEB; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-family: sans-serif; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 5; }
    </style>
</head>
<body>
    <div id="ui">Bones: 0 | Best: 0</div>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('ui');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // ПОВЕРТАЄМО ТВОЇ НАЗВИ ФАЙЛІВ
        const imgDog = new Image(); imgDog.src = '1771680846085.png';
        const imgCat = new Image(); imgCat.src = '1771681045024.png';
        const imgBone = new Image(); imgBone.src = '1771681214266.png';
        const imgHouse = new Image(); imgHouse.src = '1771681328734.png';

        let score = 0;
        let highScore = localStorage.getItem('beagleRecord') || 0;
        let gameSpeed = 5;
        let isGameOver = false;
        const gravity = 0.6;
        
        const dog = { x: 50, y: 50, w: 70, h: 70, dy: 0, jump: 12, grounded: false };
        let obstacles = [];
        let bones = [];

        function update() {
            if (isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Трава
            ctx.fillStyle = '#556B2F';
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

            // Собака
            dog.dy += gravity;
            dog.y += dog.dy;
            if (dog.y + dog.h > canvas.height - 30) {
                dog.y = canvas.height - 30 - dog.h;
                dog.dy = 0;
                dog.grounded = true;
            }

            // Малюємо пса
            ctx.drawImage(imgDog, dog.x, dog.y, dog.w, dog.h);

            // Перешкоди
            if (Math.random() < 0.01) {
                obstacles.push({ x: canvas.width, y: canvas.height - 90, w: 60, h: 60, type: Math.random() > 0.5 ? 'cat' : 'house' });
            }

            obstacles.forEach((obs, i) => {
                obs.x -= gameSpeed;
                ctx.drawImage(obs.type === 'cat' ? imgCat : imgHouse, obs.x, obs.y, obs.w, obs.h);

                if (dog.x < obs.x + obs.w - 15 && dog.x + dog.w > obs.x + 15 && dog.y < obs.y + obs.h - 10 && dog.y + dog.h > obs.y + 10) {
                    isGameOver = true;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('beagleRecord', highScore);
                    }
                    alert("Гра закінчена! Рахунок: " + score + "\nРекорд: " + highScore);
                    location.reload();
                }
                if (obs.x + obs.w < 0) obstacles.splice(i, 1);
            });

            // Кістки
            if (Math.random() < 0.01) {
                bones.push({ x: canvas.width, y: canvas.height - 150 - Math.random() * 50, w: 40, h: 30 });
            }

            bones.forEach((b, i) => {
                b.x -= gameSpeed;
                ctx.drawImage(imgBone, b.x, b.y, b.w, b.h);
                if (dog.x < b.x + b.w && dog.x + dog.w > b.x && dog.y < b.y + b.h && dog.y + dog.h > b.y) {
                    score++;
                    scoreElement.innerText = `Bones: ${score} | Best: ${highScore}`;
                    bones.splice(i, 1);
                }
            });

            gameSpeed += 0.001;
            requestAnimationFrame(update);
        }

        const action = () => { if (dog.grounded) { dog.dy = -dog.jump; dog.grounded = false; } };
        window.addEventListener('touchstart', (e) => { action(); e.preventDefault(); }, {passive: false});
        window.addEventListener('mousedown', action);

        scoreElement.innerText = `Bones: 0 | Best: ${highScore}`;
        update();
    </script>
</body>
</html>
