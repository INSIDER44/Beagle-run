<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beagle Run - Ultra Stable</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; background: #87CEEB; touch-action: none; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; font-family: sans-serif; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; }
        #game-over { position: absolute; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.85); color: white; width: 100%; height: 100%; z-index: 20; font-family: sans-serif; }
        #loading { position: absolute; color: white; font-family: sans-serif; font-size: 24px; z-index: 30; }
    </style>
</head>
<body>
    <div id="loading">Завантаження...</div>
    <div id="ui">Bones: 0 | Best: 0</div>
    <div id="game-over">
        <h1 style="color:#ff4d4d; font-size:45px; margin:0;">GAME OVER</h1>
        <p id="final-score" style="font-size:24px;">Score: 0</p>
        <p id="high-score" style="color:#ffd700; font-size:20px;">Record: 0</p>
        <p style="margin-top:20px; color:#aaa;">Tap to Restart</p>
    </div>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('ui');
        const gameOverScreen = document.getElementById('game-over');
        const loadingScreen = document.getElementById('loading');

        function resize() {
            const ratio = 16 / 9;
            let w = window.innerWidth, h = window.innerHeight;
            if (w / h > ratio) w = h * ratio; else h = w / ratio;
            canvas.width = w; canvas.height = h;
        }
        window.addEventListener('resize', resize);
        resize();

        // Система завантаження картинок
        const images = {};
        const sources = {
            dog: 'dog.png',
            cat: 'cat.png',
            bone: 'bone.png',
            house: 'house.png'
        };

        let loadedImages = 0;
        const totalImages = Object.keys(sources).length;

        for (let name in sources) {
            images[name] = new Image();
            images[name].onload = () => {
                loadedImages++;
                if (loadedImages === totalImages) startEngine();
            };
            images[name].onerror = () => {
                // Якщо картинка не знайшлась, гра не зависне, а покаже помилку в консолі
                console.error("Не вдалося завантажити: " + sources[name]);
                loadedImages++;
                if (loadedImages === totalImages) startEngine();
            };
            images[name].src = sources[name];
        }

        let score = 0, highScore = localStorage.getItem('beagleRecord') || 0;
        let gameSpeed = 5, isGameOver = false, spawnTimer = 0;
        const gravity = 0.6;
        let dog = { x: 50, y: 0, w: 60, h: 60, dy: 0, jump: 12, grounded: false };
        let obstacles = [], bones = [], clouds = [];

        function createCloud(x) {
            return { x: x, y: Math.random() * (canvas.height * 0.3), w: 30+Math.random()*30, speed: 0.2+Math.random()*0.4 };
        }
        for(let i=0; i<5; i++) clouds.push(createCloud(Math.random() * canvas.width));

        function startEngine() {
            loadingScreen.style.display = 'none';
            scoreElement.innerText = `Bones: 0 | Best: ${highScore}`;
            update();
        }

        function update() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Хмаринки (мінімалістичні)
            ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
            clouds.forEach(c => {
                c.x -= c.speed;
                ctx.beginPath();
                ctx.arc(c.x, c.y, 12, 0, Math.PI*2);
                ctx.arc(c.x+12, c.y-8, 12, 0, Math.PI*2);
                ctx.arc(c.x+24, c.y, 12, 0, Math.PI*2);
                ctx.fill();
                if (c.x + 100 < 0) Object.assign(c, createCloud(canvas.width + 50));
            });

            // Земля
            ctx.fillStyle = '#458B00';
            ctx.fillRect(0, canvas.height * 0.85, canvas.width, canvas.height * 0.15);

            // Собака
            dog.dy += gravity; dog.y += dog.dy;
            if (dog.y + dog.h > canvas.height * 0.85) {
                dog.y = canvas.height * 0.85 - dog.h;
                dog.dy = 0; dog.grounded = true;
            }
            if(images.dog.complete) ctx.drawImage(images.dog, dog.x, dog.y, dog.w, dog.h);

            // Спавн
            spawnTimer++;
            if (spawnTimer > 100) {
                if (Math.random() > 0.4) {
                    obstacles.push({ x: canvas.width, y: canvas.height * 0.85 - 55, w: 55, h: 55, type: Math.random() > 0.5 ? 'cat' : 'house' });
                } else {
                    bones.push({ x: canvas.width, y: canvas.height * 0.5, w: 35, h: 25 });
                }
                spawnTimer = 0;
            }

            // Перешкоди
            obstacles.forEach((obs, i) => {
                obs.x -= gameSpeed;
                let img = obs.type === 'cat' ? images.cat : images.house;
                if(img.complete) ctx.drawImage(img, obs.x, obs.y, obs.w, obs.h);
                if (dog.x < obs.x+obs.w-15 && dog.x+dog.w > obs.x+15 && dog.y < obs.y+obs.h-10 && dog.y+dog.h > obs.y+10) endGame();
                if (obs.x + obs.w < 0) obstacles.splice(i, 1);
            });

            // Кістки
            bones.forEach((b, i) => {
                b.x -= gameSpeed;
                if(images.bone.complete) ctx.drawImage(images.bone, b.x, b.y, b.w, b.h);
                if (dog.x < b.x+b.w && dog.x+dog.w > b.x && dog.y < b.y+b.h && dog.y+dog.h > b.y) {
                    score++;
                    scoreElement.innerText = `Bones: ${score} | Best: ${highScore}`;
                    bones.splice(i, 1);
                }
            });

            gameSpeed += 0.0004;
            requestAnimationFrame(update);
        }

        function endGame() {
            isGameOver = true;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('beagleRecord', highScore);
            }
            document.getElementById('final-score').innerText = `Score: ${score}`;
            document.getElementById('high-score').innerText = `Record: ${highScore}`;
            gameOverScreen.style.display = 'flex';
        }

        function restart() {
            score = 0; gameSpeed = 5; isGameOver = false; spawnTimer = 0;
            obstacles = []; bones = []; dog.y = 0;
            gameOverScreen.style.display = 'none';
            update();
        }

        const action = (e) => { 
            if (isGameOver) restart(); 
            else if (dog.grounded) { dog.dy = -dog.jump; dog.grounded = false; }
            if(e.type === 'touchstart') e.preventDefault();
        };
        window.addEventListener('touchstart', action, {passive: false});
        window.addEventListener('mousedown', action);
    </script>
</body>
</html>
