<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Beagle Run</title>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#1a1a1a;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:sans-serif;
}

canvas{
    display:block;
    background:#87CEEB;
    touch-action:none;
    width:100vw;
    height:56.25vw;
    max-height:100vh;
    max-width:177.78vh;
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = 1280;
canvas.height = 720;

/* === ЗЕМЛЯ === */
const groundHeight = 140;
const groundY = canvas.height - groundHeight;

/* === КАРТИНКИ === */
const imgDog = new Image(); imgDog.src = '1124-removebg-preview.png';
const imgCat = new Image(); imgCat.src = '1126-removebg-preview.png';
const imgHouse = new Image(); imgHouse.src = '1128-removebg-preview.png';
const imgBone = new Image(); imgBone.src = '1127-removebg-preview.png';
const imgCloud = new Image(); imgCloud.src = '1176-removebg-preview.png';

/* === ГРА === */
let score = 0;
let best = localStorage.getItem('beagleBest') || 0;
let gameSpeed = 9;
let spawnTimer = 0;
let isGameOver = false;
let isWaiting = true;

/* === СОБАКА === */
const dog = {
    x:150,
    w:150,
    h:150,
    y: groundY - 150,
    dy:0,
    gravity:1.5,
    jumpPower:26,
    grounded:true
};

/* === МАСИВИ === */
let obstacles = [];
let bones = [];
let clouds = [];

for(let i=0;i<5;i++){
    clouds.push({
        x:Math.random()*canvas.width,
        y:Math.random()*200,
        w:170,
        h:100,
        speed:0.4+Math.random()
    });
}

/* ================= GAME LOOP ================= */

function gameLoop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    /* НЕБО */
    ctx.fillStyle="#87CEEB";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    /* ХМАРИ */
    clouds.forEach(c=>{
        c.x -= c.speed;
        if(c.x + c.w < 0) c.x = canvas.width;
        ctx.drawImage(imgCloud,c.x,c.y,c.w,c.h);
    });

    /* ЗЕМЛЯ */
    ctx.fillStyle="#3c8d0d";
    ctx.fillRect(0,groundY,canvas.width,groundHeight);

    if(isWaiting){
        ctx.fillStyle="rgba(0,0,0,0.6)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle="white";
        ctx.font="bold 50px sans-serif";
        ctx.textAlign="center";
        ctx.fillText("TAP TO START",canvas.width/2,350);
        requestAnimationFrame(gameLoop);
        return;
    }

    if(!isGameOver){

        /* ГРАВІТАЦІЯ */
        dog.dy += dog.gravity;
        dog.y += dog.dy;

        if(dog.y + dog.h >= groundY){
            dog.y = groundY - dog.h;
            dog.dy = 0;
            dog.grounded = true;
        }

        ctx.drawImage(imgDog,dog.x,dog.y,dog.w,dog.h);

        /* СПАВН */
        spawnTimer++;
        if(spawnTimer > 90){

            const objW = 120;
            const objH = 120;
            const baseY = groundY - objH;

            obstacles.push({
                x:canvas.width,
                y:baseY,
                w:objW,
                h:objH,
                type: Math.random()>0.5 ? "cat":"house"
            });

            /* ПОДВІЙНИЙ ОБ'ЄКТ — ближче */
            if(Math.random() < 0.35){
                obstacles.push({
                    x:canvas.width + 70,   // було далеко, тепер ближче
                    y:baseY,
                    w:objW,
                    h:objH,
                    type: Math.random()>0.5 ? "cat":"house"
                });
            }

            if(Math.random() < 0.6){
                bones.push({
                    x:canvas.width+40,
                    y:groundY - 260,
                    w:70,
                    h:50
                });
            }

            spawnTimer=0;
        }

        /* ПЕРЕШКОДИ */
        obstacles.forEach(o=>{
            o.x -= gameSpeed;
            ctx.drawImage(
                o.type==="cat"?imgCat:imgHouse,
                o.x,o.y,o.w,o.h
            );

            /* КОЛІЗІЯ */
            if(
                dog.x < o.x + o.w - 25 &&
                dog.x + dog.w - 25 > o.x &&
                dog.y < o.y + o.h - 20 &&
                dog.y + dog.h - 20 > o.y
            ){
                isGameOver=true;
                if(score>best){
                    best=score;
                    localStorage.setItem("beagleBest",best);
                }
            }
        });

        obstacles = obstacles.filter(o=>o.x>-200);

        /* КІСТКИ */
        bones.forEach((b,i)=>{
            b.x -= gameSpeed;
            ctx.drawImage(imgBone,b.x,b.y,b.w,b.h);

            if(
                dog.x < b.x + b.w &&
                dog.x + dog.w > b.x &&
                dog.y < b.y + b.h &&
                dog.y + dog.h > b.y
            ){
                score++;
                bones.splice(i,1);
            }
        });

        /* ТЕКСТ */
        ctx.fillStyle="white";
        ctx.font="bold 30px sans-serif";
        ctx.textAlign="left";
        ctx.fillText("Bones: "+score,40,50);
        ctx.textAlign="right";
        ctx.fillText("Best: "+best,canvas.width-40,50);

    }else{
        ctx.fillStyle="rgba(0,0,0,0.7)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle="white";
        ctx.font="bold 50px sans-serif";
        ctx.textAlign="center";
        ctx.fillText("GAME OVER",canvas.width/2,320);
        ctx.font="30px sans-serif";
        ctx.fillText("Tap to Restart",canvas.width/2,380);
    }

    requestAnimationFrame(gameLoop);
}

/* ================= INPUT ================= */

function handleInput(){
    if(isWaiting){
        isWaiting=false;
        return;
    }

    if(isGameOver){
        score=0;
        obstacles=[];
        bones=[];
        isGameOver=false;
        dog.y=groundY-dog.h;
        return;
    }

    if(dog.grounded){
        dog.dy = -dog.jumpPower;
        dog.grounded=false;
    }
}

window.addEventListener("touchstart",e=>{
    e.preventDefault();
    handleInput();
},{passive:false});

window.addEventListener("mousedown",handleInput);

gameLoop();
</script>
</body>
</html>
