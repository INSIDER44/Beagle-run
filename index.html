<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beagle Run - Sociogram Edition</title>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #1a1a1a; overflow: hidden; 
            display: flex; justify-content: center; align-items: center;
        }
        canvas { 
            display: block; background: #87CEEB; touch-action: none; 
            width: 100vw; height: 56.25vw; 
            max-height: 100vh; max-width: 177.78vh;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        #ui { position: absolute; top: 15px; width: 100%; text-align: center; color: white; font-family: sans-serif; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; }
        
        #game-over { 
            position: absolute; width: 100%; height: 100%; 
            display: none; flex-direction: column; align-items: center; justify-content: center; 
            background: rgba(0, 0, 0, 0.9); color: white; z-index: 20; font-family: sans-serif; 
        }

        #leaderboard {
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            width: 280px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #leaderboard-list {
            max-height: 180px;
            overflow-y: auto;
            margin-top: 5px;
        }

        #leaderboard-list::-webkit-scrollbar { width: 4px; }
        #leaderboard-list::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 10px; }

        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
        }
        
        .player-name {
            flex-grow: 1;
            text-align: left;
            margin-left: 10px;
            color: #eee;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .restart-hint { margin-top: 15px; color: #aaa; font-size: 14px; animation: blink 1.5s infinite; cursor: pointer; }
        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div id="ui">Bones: 0 | Best: 0</div>
    <div id="game-over">
        <h1 style="color:#ff4d4d; font-size:32px; margin:0;">GAME OVER</h1>
        <p id="final-score" style="font-size:22px; margin: 10px 0;">Your Score: 0</p>
        
        <div id="leaderboard">
            <div style="font-weight:bold; text-align:center; color:#ffd700; margin-bottom:8px; letter-spacing: 1px;">🏆 GLOBAL TOP 20</div>
            <div id="leaderboard-list"></div>
        </div>
        
        <p class="restart-hint" onclick="restart()">Tap to Run Again</p>
    </div>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('ui');
        const gameOverScreen = document.getElementById('game-over');

        // Конфігурація Sociogram
        const SG_API_KEY = '22de15497bc8c6ed288b63698e87409311c6bf93cb50c0ffefdaa858f028578e';

        canvas.width = 1280;
        canvas.height = 720;

        // Зображення
        const imgDog = new Image(); imgDog.src = '1124-removebg-preview.png';
        const imgCat = new Image(); imgCat.src = '1126-removebg-preview.png';
        const imgBone = new Image(); imgBone.src = '1127-removebg-preview.png';
        const imgHouse = new Image(); imgHouse.src = '1128-removebg-preview.png';
        const imgCloud = new Image(); imgCloud.src = '1176-removebg-preview.png';

        let score = 0, highScore = localStorage.getItem('beagleBest') || 0;
        let gameSpeed = 7, isGameOver = false, spawnTimer = 0;
        let lastSpeedUpdate = Date.now();
        const gravity = 1.0;
        
        let countdownValue = 3;
        let isCountdown = true;
        let countdownTimer = 0;

        let dog = { x: 100, y: 0, w: 125, h: 125, dy: 0, jump: 25, grounded: false };
        let obstacles = [], bones = [], clouds = [];

        function createCloud(x) {
            return { x: x, y: Math.random() * 180, w: 160, h: 100, speed: 1 + Math.random() };
        }
        for(let i=0; i<4; i++) clouds.push(createCloud(Math.random() * canvas.width));

        async function getSociogramUser() {
            if (window.Sociogram && window.Sociogram.getUser) {
                return window.Sociogram.getUser();
            }
            return { name: "Beagle Player" };
        }

        function update() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            clouds.forEach(c => {
                if (!isCountdown) c.x -= c.speed;
                ctx.drawImage(imgCloud, c.x, c.y, c.w, c.h);
                if (c.x + c.w < 0) Object.assign(c, createCloud(canvas.width + 50));
            });

            ctx.fillStyle = '#458B00';
            const groundY = canvas.height * 0.85;
            ctx.fillRect(0, groundY, canvas.width, canvas.height * 0.15);

            if (isCountdown) {
                countdownTimer++;
                if (countdownTimer >= 60) { countdownValue--; countdownTimer = 0; }
                if (countdownValue <= 0) isCountdown = false;

                ctx.drawImage(imgDog, dog.x, groundY + 20 - dog.h, dog.w, dog.h);
                ctx.fillStyle = "rgba(0,0,0,0.3)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "bold 150px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(countdownValue, canvas.width / 2, canvas.height / 2 + 50);
                requestAnimationFrame(update);
                return;
            }

            let now = Date.now();
            if (now - lastSpeedUpdate > 15000) { gameSpeed += 1.5; lastSpeedUpdate = now; }

            dog.dy += gravity; dog.y += dog.dy;
            if (dog.y + dog.h > groundY + 20) { dog.y = groundY + 20 - dog.h; dog.dy = 0; dog.grounded = true; }
            ctx.drawImage(imgDog, dog.x, dog.y, dog.w, dog.h);

            spawnTimer++;
            if (spawnTimer > (100 - gameSpeed * 2)) {
                const type = Math.random() > 0.5 ? 'cat' : 'house';
                obstacles.push({ x: canvas.width, y: groundY - 80, w: 105, h: 105, type: type });
                if (Math.random() > 0.4) obstacles.push({ x: canvas.width + 65, y: groundY - 80, w: 105, h: 105, type: type });
                if (Math.random() > 0.5) bones.push({ x: canvas.width + 200, y: 300, w: 65, h: 45 });
                spawnTimer = 0;
            }

            obstacles.forEach((obs, i) => {
                obs.x -= gameSpeed;
                ctx.drawImage(obs.type === 'cat' ? imgCat : imgHouse, obs.x, obs.y, obs.w, obs.h);
                let dH = { x: dog.x + 45, y: dog.y + 40, w: dog.w - 90, h: dog.h - 50 };
                let oH = { x: obs.x + 45, y: obs.y + 40, w: obs.w - 90, h: obs.h - 50 };
                if (dH.x < oH.x + oH.w && dH.x + dH.w > oH.x && dH.y < oH.y + oH.h && dH.y + dH.h > oH.y) endGame();
                if (obs.x + obs.w < -200) obstacles.splice(i, 1);
            });

            bones.forEach((b, i) => {
                b.x -= gameSpeed;
                ctx.drawImage(imgBone, b.x, b.y, b.w, b.h);
                if (dog.x < b.x + b.w && dog.x + dog.w > b.x && dog.y < b.y + b.h && dog.y + dog.h > b.y) {
                    score++;
                    scoreElement.innerText = `Bones: ${score} | Best: ${highScore}`;
                    bones.splice(i, 1);
                }
            });

            requestAnimationFrame(update);
        }

        async function endGame() {
            isGameOver = true;
            const user = await getSociogramUser();
            const playerName = user.name || "Runner";

            // Відправка на сервер Sociogram
            try {
                fetch('https://api.sociogram.org/v1/scores/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-API-KEY': SG_API_KEY },
                    body: JSON.stringify({ score: score, username: playerName, app_id: 'beagle-run' })
                });
            } catch (e) {}

            // Локальний ТОП-20
            let leaders = JSON.parse(localStorage.getItem('beagleLeadersObj')) || [];
            const idx = leaders.findIndex(l => l.name === playerName);
            if (idx !== -1) { if (score > leaders[idx].score) leaders[idx].score = score; }
            else leaders.push({ name: playerName, score: score });
            leaders.sort((a, b) => b.score - a.score);
            leaders = leaders.slice(0, 20);
            localStorage.setItem('beagleLeadersObj', JSON.stringify(leaders));
            
            const listElement = document.getElementById('leaderboard-list');
            listElement.innerHTML = leaders.map((entry, i) => `
                <div class="score-row">
                    <span style="color:${entry.name === playerName ? '#00ff00' : '#ffd700'}; width:25px;">#${i+1}</span>
                    <span class="player-name">${entry.name}</span>
                    <span style="font-weight:bold;">${entry.score} 🦴</span>
                </div>
            `).join('');

            if (score > highScore) { highScore = score; localStorage.setItem('beagleBest', highScore); }
            document.getElementById('final-score').innerText = `Your Score: ${score}`;
            gameOverScreen.style.display = 'flex';
        }

        function restart() {
            score = 0; gameSpeed = 7; isGameOver = false; spawnTimer = 0;
            countdownValue = 3; isCountdown = true; countdownTimer = 0;
            lastSpeedUpdate = Date.now(); obstacles = []; bones = []; dog.y = 0;
            gameOverScreen.style.display = 'none';
            scoreElement.innerText = `Bones: 0 | Best: ${highScore}`;
            update();
        }

        const handleAction = (e) => {
            if (isGameOver) restart(); 
            else if (!isCountdown && dog.grounded) { dog.dy = -dog.jump; dog.grounded = false; }
            if (e.cancelable) e.preventDefault(); 
        };

        window.addEventListener('touchstart', handleAction, { passive: false });
        window.addEventListener('mousedown', (e) => { if (e.button === 0) handleAction(e); });

        scoreElement.innerText = `Bones: 0 | Best: ${highScore}`;
        update();
    </script>
</body>
</html>
