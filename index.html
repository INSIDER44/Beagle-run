<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beagle Run - Stable Fix</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1a1a1a; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; background: #87CEEB; touch-action: none; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; border: 2px solid #333; }
        #hidden-input { position: absolute; top: -100px; left: -100px; width: 1px; height: 1px; opacity: 0; }
    </style>
</head>
<body>
    <input type="text" id="hidden-input" maxlength="12">
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const hiddenInput = document.getElementById('hidden-input');

        canvas.width = 1280; canvas.height = 720;
        
        const imgDog = new Image(); imgDog.src = '1124-removebg-preview.png';
        const imgCat = new Image(); imgCat.src = '1126-removebg-preview.png';
        const imgBone = new Image(); imgBone.src = '1127-removebg-preview.png';
        const imgHouse = new Image(); imgHouse.src = '1128-removebg-preview.png';
        const imgCloud = new Image(); imgCloud.src = '1176-removebg-preview.png';

        let score = 0, highScore = localStorage.getItem('beagleBest') || 0;
        let gameSpeed = 7, isGameOver = false, isNaming = !localStorage.getItem('beagleUserName');
        let tempName = "", spawnTimer = 0;
        let dog = { x: 100, y: 0, w: 125, h: 125, dy: 0, jump: 25, grounded: false };
        let obstacles = [], bones = [], clouds = [];

        // Ініціалізація хмар
        for(let i=0; i<5; i++) clouds.push({ x: Math.random()*canvas.width, y: Math.random()*200, w: 160, h: 100, speed: 0.5 + Math.random() });

        function drawButton(text, x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.roundRect ? ctx.beginPath() || ctx.roundRect(x, y, w, h, 10) || ctx.fill() : ctx.fillRect(x, y, w, h);
            ctx.fillStyle = "black";
            ctx.font = "bold 28px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(text, x + w/2, y + h/2 + 10);
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const groundY = canvas.height * 0.85;

            // Хмари та фон
            clouds.forEach(c => {
                c.x -= c.speed;
                ctx.drawImage(imgCloud, c.x, c.y, c.w, c.h);
                if (c.x + c.w < 0) c.x = canvas.width;
            });

            ctx.fillStyle = '#458B00';
            ctx.fillRect(0, groundY, canvas.width, canvas.height * 0.15);

            if (isNaming) {
                ctx.fillStyle = "rgba(0,0,0,0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "bold 40px sans-serif";
                ctx.fillText("ВВЕДІТЬ СВІЙ НІКНЕЙМ:", canvas.width/2, 250);
                
                // Поле вводу
                ctx.fillStyle = "white";
                ctx.fillRect(canvas.width/2 - 200, 300, 400, 60);
                ctx.fillStyle = "black";
                ctx.fillText(tempName + (Date.now() % 1000 < 500 ? "|" : ""), canvas.width/2, 345);
                
                drawButton("ГРАТИ", canvas.width/2 - 100, 400, 200, 60, "#ffd700");
            } 
            else if (isGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff4d4d";
                ctx.font = "bold 80px sans-serif";
                ctx.fillText("GAME OVER", canvas.width/2, 200);
                ctx.fillStyle = "white";
                ctx.font = "30px sans-serif";
                ctx.fillText(`Твій результат: ${score}`, canvas.width/2, 280);
                
                drawButton("СПРОБУВАТИ ЗНОВУ", canvas.width/2 - 150, 400, 300, 70, "#ffd700");
            } 
            else {
                // Логіка гри
                dog.dy += 1.2; dog.y += dog.dy;
                if (dog.y + dog.h > groundY + 20) { dog.y = groundY + 20 - dog.h; dog.dy = 0; dog.grounded = true; }
                ctx.drawImage(imgDog, dog.x, dog.y, dog.w, dog.h);

                spawnTimer++;
                if (spawnTimer > 80) {
                    obstacles.push({ x: canvas.width, y: groundY - 85, w: 100, h: 100, type: Math.random() > 0.5 ? 'cat' : 'house' });
                    if (Math.random() > 0.7) bones.push({ x: canvas.width + 200, y: 350, w: 60, h: 40 });
                    spawnTimer = 0;
                }

                obstacles.forEach((o, i) => {
                    o.x -= gameSpeed;
                    ctx.drawImage(o.type === 'cat' ? imgCat : imgHouse, o.x, o.y, o.w, o.h);
                    if (dog.x + 40 < o.x + 70 && dog.x + 80 > o.x + 20 && dog.y + 40 < o.y + 80 && dog.y + 90 > o.y + 20) isGameOver = true;
                    if (o.x < -100) obstacles.splice(i, 1);
                });

                bones.forEach((b, i) => {
                    b.x -= gameSpeed;
                    ctx.drawImage(imgBone, b.x, b.y, b.w, b.h);
                    if (dog.x < b.x + b.w && dog.x + dog.w > b.x && dog.y < b.y + b.h && dog.y + dog.h > b.y) {
                        score++; bones.splice(i, 1);
                    }
                });

                ctx.fillStyle = "white";
                ctx.font = "bold 30px sans-serif";
                ctx.textAlign = "left";
                ctx.fillText(`🦴 Кістки: ${score}`, 30, 50);
                ctx.textAlign = "right";
                ctx.fillText(`Кращий: ${highScore}`, canvas.width - 30, 50);
            }
            requestAnimationFrame(gameLoop);
        }

        // Обробка кліків/дотиків через Canvas
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const tx = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
            const ty = (e.touches[0].clientY - rect.top) * (canvas.height / rect.height);

            if (isNaming) {
                // Натискання на поле вводу
                if (tx > canvas.width/2 - 200 && tx < canvas.width/2 + 200 && ty > 300 && ty < 360) {
                    hiddenInput.focus();
                }
                // Кнопка ГРАТИ
                if (tx > canvas.width/2 - 100 && tx < canvas.width/2 + 100 && ty > 400 && ty < 460) {
                    if (tempName.trim().length >= 2) {
                        localStorage.setItem('beagleUserName', tempName);
                        isNaming = false;
                    }
                }
            } else if (isGameOver) {
                // Кнопка RESTART
                if (tx > canvas.width/2 - 150 && tx < canvas.width/2 + 150 && ty > 400 && ty < 470) {
                    score = 0; obstacles = []; bones = []; dog.y = 0; isGameOver = false;
                }
            } else if (dog.grounded) {
                dog.dy = -26; dog.grounded = false;
            }
        });

        hiddenInput.addEventListener('input', (e) => {
            tempName = e.target.value.toUpperCase();
        });

        // Запуск
        gameLoop();
    </script>
</body>
</html>
