<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beagle Run - Full View</title>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #1a1a1a; overflow: hidden; 
            display: flex; justify-content: center; align-items: center;
        }
        
        canvas { 
            display: block; 
            background: #87CEEB; 
            touch-action: none; 
            /* Масштабуємо canvas так, щоб він займав максимум місця */
            width: 100vw; 
            height: 56.25vw; /* Співвідношення 16:9 */
            max-height: 100vh;
            max-width: 177.78vh;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        #ui { position: absolute; top: 15px; width: 100%; text-align: center; color: white; font-family: sans-serif; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; }
        #game-over { position: absolute; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.85); color: white; z-index: 20; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="ui">Bones: 0 | Best: 0</div>
    <div id="game-over">
        <h1 style="color:#ff4d4d; font-size:45px; margin:0;">GAME OVER</h1>
        <p id="final-score" style="font-size:26px;">Score: 0</p>
        <p id="high-score" style="color:#ffd700;">Best: 0</p>
        <p style="margin-top:20px; color:#aaa;">Tap to Restart</p>
    </div>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('ui');
        const gameOverScreen = document.getElementById('game-over');

        // Встановлюємо високу внутрішню роздільну здатність для чіткості
        canvas.width = 1280;
        canvas.height = 720;

        // Твої оновлені файли
        const imgDog = new Image(); imgDog.src = '1124-removebg-preview.png';
        const imgCat = new Image(); imgCat.src = '1126-removebg-preview.png';
        const imgBone = new Image(); imgBone.src = '1127-removebg-preview.png';
        const imgHouse = new Image(); imgHouse.src = '1128-removebg-preview.png';
        const imgCloud = new Image(); imgCloud.src = '1176-removebg-preview.png';

        let score = 0, highScore = localStorage.getItem('beagleBest') || 0;
        let gameSpeed = 7, isGameOver = false, spawnTimer = 0;
        const gravity = 0.8;
        
        let dog = { x: 100, y: 0, w: 130, h: 130, dy: 0, jump: 23, grounded: false };
        let obstacles = [], bones = [], clouds = [];

        function createCloud(x) {
            return { x: x, y: Math.random() * 180, w: 160, h: 100, speed: 0.5 + Math.random() * 1.5 };
        }
        for(let i=0; i<4; i++) clouds.push(createCloud(Math.random() * canvas.width));

        function update() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Хмари: тепер вони рухаються ВЛІВО (назустріч)
            clouds.forEach(c => {
                c.x -= c.speed; // Віднімаємо швидкість, щоб вони йшли вліво
                ctx.drawImage(imgCloud, c.x, c.y, c.w, c.h);
                if (c.x + c.w < 0) { // Якщо хмара вийшла за лівий край
                    Object.assign(c, createCloud(canvas.width + 50));
                }
            });

            // 2. Земля
            ctx.fillStyle = '#458B00';
            const groundY = canvas.height * 0.85;
            ctx.fillRect(0, groundY, canvas.width, canvas.height * 0.15);

            // 3. Собака: приземлення з зануренням
            dog.dy += gravity; dog.y += dog.dy;
            if (dog.y + dog.h > groundY + 50) {
                dog.y = groundY + 50 - dog.h;
                dog.dy = 0; dog.grounded = true;
            }
            ctx.drawImage(imgDog, dog.x, dog.y, dog.w, dog.h);

            // 4. Спавн перешкод
            spawnTimer++;
            if (spawnTimer > 85) {
                const type = Math.random() > 0.5 ? 'cat' : 'house';
                const isDouble = Math.random() > 0.35;
                obstacles.push({ x: canvas.width, y: groundY - 25, w: 110, h: 110, type: type });
                if (isDouble) {
                    obstacles.push({ x: canvas.width + 115, y: groundY - 25, w: 110, h: 110, type: type });
                }
                if (Math.random() > 0.5) bones.push({ x: canvas.width + 200, y: 320, w: 70, h: 50 });
                spawnTimer = 0;
            }

            // 5. Перешкоди
            obstacles.forEach((obs, i) => {
                obs.x -= gameSpeed;
                ctx.drawImage(obs.type === 'cat' ? imgCat : imgHouse, obs.x, obs.y, obs.w, obs.h);
                if (dog.x < obs.x + obs.w - 35 && dog.x + dog.w > obs.x + 35 && dog.y < obs.y + obs.h - 25 && dog.y + dog.h > obs.y + 25) endGame();
                if (obs.x + obs.w < -200) obstacles.splice(i, 1);
            });

            // 6. Кістки
            bones.forEach((b, i) => {
                b.x -= gameSpeed;
                ctx.drawImage(imgBone, b.x, b.y, b.w, b.h);
                if (dog.x < b.x + b.w && dog.x + dog.w > b.x && dog.y < b.y + b.h && dog.y + dog.h > b.y) {
                    score++;
                    scoreElement.innerText = `Bones: ${score} | Best: ${highScore}`;
                    bones.splice(i, 1);
                }
            });

            gameSpeed += 0.0012;
            requestAnimationFrame(update);
        }

        function endGame() {
            isGameOver = true;
            if (score > highScore) { highScore = score; localStorage.setItem('beagleBest', highScore); }
            document.getElementById('final-score').innerText = `Score: ${score}`;
            document.getElementById('high-score').innerText = `Best: ${highScore}`;
            gameOverScreen.style.display = 'flex';
        }

        function restart() {
            score = 0; gameSpeed = 7; isGameOver = false; spawnTimer = 0;
            obstacles = []; bones = []; dog.y = 0;
            gameOverScreen.style.display = 'none';
            scoreElement.innerText = `Bones: 0 | Best: ${highScore}`;
            update();
        }

        const action = (e) => { 
            if (isGameOver) restart(); else if (dog.grounded) { dog.dy = -26; dog.grounded = false; }
            if(e.type === 'touchstart') e.preventDefault();
        };
        window.addEventListener('touchstart', action, {passive: false});
        window.addEventListener('mousedown', action);

        scoreElement.innerText = `Bones: 0 | Best: ${highScore}`;
        update();
    </script>
</body>
</html>
