<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beagle Run - Fixed</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; background: #87CEEB; touch-action: none; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        #ui { position: absolute; top: 5%; width: 100%; text-align: center; color: white; font-family: sans-serif; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">Bones: 0</div>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('ui');

        function resize() {
            const ratio = 16 / 9;
            let w = window.innerWidth;
            let h = window.innerHeight;
            if (w / h > ratio) { w = h * ratio; } else { h = w / ratio; }
            canvas.width = w; canvas.height = h;
        }
        window.addEventListener('resize', resize);
        resize();

        const imgDog = new Image(); imgDog.src = '1771680846085.png';
        const imgCat = new Image(); imgCat.src = '1771681045024.png';
        const imgBone = new Image(); imgBone.src = '1771681214266.png';
        const imgHouse = new Image(); imgHouse.src = '1771681328734.png';

        let score = 0;
        let gameSpeed = 5;
        let isGameOver = false;
        const gravity = 0.6;
        const dog = { x: 50, y: 0, w: 60, h: 60, dy: 0, jump: 12, grounded: false };
        const obstacles = [];
        const bones = [];
        let lastObstacleX = 0;

        function spawn() {
            if (isGameOver) return;
            
            // ПЕРЕВІРКА ДИСТАНЦІЇ: нова перешкода не з'явиться занадто близько до попередньої
            if (Math.random() < 0.02 && (canvas.width - lastObstacleX) > 350) {
                let type = Math.random() > 0.5 ? 'cat' : 'house';
                obstacles.push({ x: canvas.width, y: canvas.height * 0.85 - 55, w: 55, h: 55, type: type });
                lastObstacleX = canvas.width;
            }

            if (Math.random() < 0.015) {
                bones.push({ x: canvas.width, y: canvas.height * 0.4 + Math.random() * 100, w: 35, h: 25 });
            }
            requestAnimationFrame(spawn);
        }

        function update() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Трава
            ctx.fillStyle = '#458B00';
            ctx.fillRect(0, canvas.height * 0.85, canvas.width, canvas.height * 0.15);

            // Собака
            dog.dy += gravity;
            dog.y += dog.dy;
            if (dog.y + dog.h > canvas.height * 0.85) {
                dog.y = canvas.height * 0.85 - dog.h;
                dog.dy = 0;
                dog.grounded = true;
            }

            ctx.drawImage(imgDog, dog.x, dog.y, dog.w, dog.h);

            // Обробка перешкод
            obstacles.forEach((obs, i) => {
                obs.x -= gameSpeed;
                ctx.drawImage(obs.type === 'cat' ? imgCat : imgHouse, obs.x, obs.y, obs.w, obs.h);
                
                // Останній X для контролю дистанції
                if (i === obstacles.length - 1) lastObstacleX = obs.x;

                // ФІКС КОЛІЗІЙ: зменшуємо зону ураження на 15 пікселів з кожного боку
                if (dog.x < obs.x + obs.w - 15 && 
                    dog.x + dog.w > obs.x + 15 && 
                    dog.y < obs.y + obs.h - 10 && 
                    dog.y + dog.h > obs.y + 10) {
                    isGameOver = true;
                    alert("Ой! Спробуй ще раз. Кісточок: " + score);
                    location.reload();
                }

                if (obs.x + obs.w < 0) obstacles.splice(i, 1);
            });

            bones.forEach((b, i) => {
                b.x -= gameSpeed;
                ctx.drawImage(imgBone, b.x, b.y, b.w, b.h);
                if (dog.x < b.x + b.w && dog.x + dog.w > b.x && dog.y < b.y + b.h && dog.y + dog.h > b.y) {
                    score++;
                    scoreElement.innerText = "Bones: " + score;
                    bones.splice(i, 1);
                }
            });

            gameSpeed += 0.0005; // Повільніше прискорення для балансу
            requestAnimationFrame(update);
        }

        const handleJump = () => { if (dog.grounded) { dog.dy = -dog.jump; dog.grounded = false; } };
        window.addEventListener('touchstart', (e) => { handleJump(); e.preventDefault(); }, {passive: false});
        window.addEventListener('mousedown', handleJump);

        spawn();
        update();
    </script>
</body>
</html>
