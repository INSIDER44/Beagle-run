<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beagle Run - Global Fix</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #1a1a1a; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        canvas { display: block; background: #87CEEB; touch-action: none; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        canvas.width = 1280; canvas.height = 720;
        
        const imgDog = new Image(); imgDog.src = '1124-removebg-preview.png';
        const imgCat = new Image(); imgCat.src = '1126-removebg-preview.png';
        const imgBone = new Image(); imgBone.src = '1127-removebg-preview.png';
        const imgHouse = new Image(); imgHouse.src = '1128-removebg-preview.png';
        const imgCloud = new Image(); imgCloud.src = '1176-removebg-preview.png';

        let score = 0, highScore = localStorage.getItem('beagleBest') || 0;
        let gameSpeed = 7, isGameOver = false, isWaiting = true;
        let spawnTimer = 0, playerName = localStorage.getItem('beagleUserName') || "Player";
        let dog = { x: 150, y: 0, w: 125, h: 125, dy: 0, jump: 26, grounded: false };
        let obstacles = [], bones = [], clouds = [];

        for(let i=0; i<5; i++) clouds.push({ x: Math.random()*canvas.width, y: Math.random()*180, w: 160, h: 100, speed: 0.5 + Math.random() });

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const groundY = canvas.height * 0.85;

            clouds.forEach(c => {
                c.x -= c.speed;
                ctx.drawImage(imgCloud, c.x, c.y, c.w, c.h);
                if (c.x + c.w < 0) c.x = canvas.width;
            });
            ctx.fillStyle = '#458B00';
            ctx.fillRect(0, groundY, canvas.width, canvas.height * 0.15);

            if (isWaiting) {
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white";
                ctx.font = "bold 50px Arial";
                ctx.textAlign = "center";
                ctx.fillText(`WELCOME, ${playerName.toUpperCase()}!`, canvas.width/2, 300);
                ctx.font = "30px Arial";
                ctx.fillText("TAP ANYWHERE TO START", canvas.width/2, 360);
            } 
            else if (isGameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff4d4d";
                ctx.font = "bold 80px Arial";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", canvas.width/2, 220);
                ctx.fillStyle = "white";
                ctx.font = "40px Arial";
                ctx.fillText(`Score: ${score}`, canvas.width/2, 300);
                
                // Huge restart button
                ctx.fillStyle = "#ffd700";
                ctx.beginPath();
                if (ctx.roundRect) ctx.roundRect(canvas.width/2 - 200, 380, 400, 100, 20); else ctx.rect(canvas.width/2 - 200, 380, 400, 100);
                ctx.fill();
                ctx.fillStyle = "black";
                ctx.font = "bold 40px Arial";
                ctx.fillText("PLAY AGAIN", canvas.width/2, 445);
            } 
            else {
                dog.dy += 1.3; dog.y += dog.dy;
                if (dog.y + dog.h > groundY + 20) { dog.y = groundY + 20 - dog.h; dog.dy = 0; dog.grounded = true; }
                ctx.drawImage(imgDog, dog.x, dog.y, dog.w, dog.h);

                spawnTimer++;
                if (spawnTimer > (90 - gameSpeed)) {
                    obstacles.push({ x: canvas.width, y: groundY - 85, w: 100, h: 100, type: Math.random() > 0.5 ? 'cat' : 'house' });
                    if (Math.random() > 0.6) bones.push({ x: canvas.width + 200, y: 350, w: 60, h: 40 });
                    spawnTimer = 0;
                }

                obstacles.forEach((o, i) => {
                    o.x -= gameSpeed;
                    ctx.drawImage(o.type === 'cat' ? imgCat : imgHouse, o.x, o.y, o.w, o.h);
                    if (dog.x + 40 < o.x + 70 && dog.x + 85 > o.x + 15 && dog.y + 35 < o.y + 80 && dog.y + 95 > o.y + 15) isGameOver = true;
                    if (o.x < -100) obstacles.splice(i, 1);
                });

                bones.forEach((b, i) => {
                    b.x -= gameSpeed;
                    ctx.drawImage(imgBone, b.x, b.y, b.w, b.h);
                    if (dog.x < b.x + b.w && dog.x + dog.w > b.x && dog.y < b.y + b.h && dog.y + dog.h > b.y) {
                        score++; bones.splice(i, 1);
                    }
                });

                ctx.fillStyle = "white"; ctx.font = "bold 35px Arial"; ctx.textAlign = "left";
                ctx.fillText(`Bones: ${score}`, 40, 60);
                ctx.textAlign = "right"; ctx.fillText(`Best: ${highScore}`, canvas.width - 40, 60);
            }
            requestAnimationFrame(gameLoop);
        }

        function handleInput(e) {
            if (e) e.preventDefault();
            if (isWaiting) {
                isWaiting = false;
            } else if (isGameOver) {
                if (score > highScore) { highScore = score; localStorage.setItem('beagleBest', highScore); }
                // Reset game
                score = 0; obstacles = []; bones = []; dog.y = 0; isGameOver = false;
            } else if (dog.grounded) {
                dog.dy = -dog.jump; dog.grounded = false;
            }
        }

        // Attach listeners to the WHOLE window to avoid dead zones
        window.addEventListener('touchstart', handleInput, { passive: false });
        window.addEventListener('mousedown', handleInput);
        
        gameLoop();
    </script>
</body>
</html>
