<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beagle Run - Centered</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #2c3e50; /* Темний фон навколо гри */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            touch-action: manipulation;
        }
        canvas { 
            display: block; 
            background: #87CEEB; /* Колір неба */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
        }
        #ui { 
            position: absolute; 
            top: 40px; 
            left: 50%;
            transform: translateX(-50%);
            color: white; 
            font-family: sans-serif; 
            font-size: 24px; 
            font-weight: bold; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="ui">Bones: 0</div>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('ui');

        // Робимо фіксоване ігрове поле 16:9 для стабільності
        canvas.width = 800;
        canvas.height = 450;

        // Підключення твоїх картинок
        const imgDog = new Image(); imgDog.src = '1771680846085.png';
        const imgCat = new Image(); imgCat.src = '1771681045024.png';
        const imgBone = new Image(); imgBone.src = '1771681214266.png';
        const imgHouse = new Image(); imgHouse.src = '1771681328734.png';

        let score = 0;
        let gameSpeed = 6;
        let isGameOver = false;
        const gravity = 0.8;
        const groundY = 380; // Лінія землі (трохи вище низу полотна)

        const dog = { x: 80, y: groundY - 70, w: 70, h: 70, dy: 0, jump: 15, grounded: false };
        const obstacles = [];
        const bones = [];

        function spawn() {
            if (isGameOver) return;
            if (Math.random() < 0.015) {
                obstacles.push({ x: canvas.width, y: groundY - 60, w: 60, h: 60, type: Math.random() > 0.5 ? 'cat' : 'house' });
            }
            if (Math.random() < 0.02) {
                bones.push({ x: canvas.width, y: groundY - 150, w: 40, h: 30 });
            }
            requestAnimationFrame(spawn);
        }

        function update() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Малюємо траву (землю)
            ctx.fillStyle = '#556B2F';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

            // Собака
            dog.dy += gravity;
            dog.y += dog.dy;
            if (dog.y + dog.h > groundY) {
                dog.y = groundY - dog.h;
                dog.dy = 0;
                dog.grounded = true;
            }

            // Малюємо з ефектом видалення білого фону
            ctx.globalCompositeOperation = 'multiply';
            ctx.drawImage(imgDog, dog.x, dog.y, dog.w, dog.h);

            // Перешкоди
            obstacles.forEach((obs, i) => {
                obs.x -= gameSpeed;
                ctx.drawImage(obs.type === 'cat' ? imgCat : imgHouse, obs.x, obs.y, obs.w, obs.h);
                
                // Зіткнення
                if (dog.x < obs.x + obs.w - 15 && dog.x + dog.w > obs.x + 15 && dog.y < obs.y + obs.h - 15 && dog.y + dog.h > obs.y + 15) {
                    isGameOver = true;
                    alert("Гра закінчена! Твій результат: " + score);
                    location.reload();
                }
                if (obs.x + obs.w < 0) obstacles.splice(i, 1);
            });

            // Кістки
            bones.forEach((b, i) => {
                b.x -= gameSpeed;
                ctx.drawImage(imgBone, b.x, b.y, b.w, b.h);
                if (dog.x < b.x + b.w && dog.x + dog.w > b.x && dog.y < b.y + b.h && dog.y + dog.h > b.y) {
                    score++;
                    scoreElement.innerText = "Bones: " + score;
                    bones.splice(i, 1);
                }
                if (b.x + b.w < 0) bones.splice(i, 1);
            });

            ctx.globalCompositeOperation = 'source-over';
            gameSpeed += 0.001;
            requestAnimationFrame(update);
        }

        // Керування (тапай по всьому екрану)
        window.addEventListener('touchstart', (e) => { 
            if (dog.grounded) { dog.dy = -dog.jump; dog.grounded = false; }
            e.preventDefault();
        }, {passive: false});

        window.addEventListener('mousedown', () => {
            if (dog.grounded) { dog.dy = -dog.jump; dog.grounded = false; }
        });

        spawn();
        update();
    </script>
</body>
</html>
