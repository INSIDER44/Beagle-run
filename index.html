<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beagle Run</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; touch-action: manipulation; }
        canvas { display: block; background: #90EE90; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="ui">Bones: 0</div>
    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('ui');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let gameSpeed = 5;
        let isGameOver = false;
        const gravity = 0.6;

        const dog = { x: 50, y: canvas.height - 150, w: 40, h: 30, dy: 0, jump: 12, grounded: false };
        const obstacles = [];
        const bones = [];

        // Функція малювання "Піксельного Бігля"
        function drawDog(x, y) {
            ctx.fillStyle = '#8B4513'; // Коричневий
            ctx.fillRect(x, y, 40, 25); // Тіло
            ctx.fillStyle = 'white';
            ctx.fillRect(x + 30, y + 5, 10, 10); // Мордочка
            ctx.fillStyle = 'black';
            ctx.fillRect(x + 5, y - 5, 10, 15); // Вухо
        }

        // Малювання кістки
        function drawBone(x, y) {
            ctx.fillStyle = 'white';
            ctx.fillRect(x, y, 20, 10);
            ctx.fillRect(x-5, y-5, 10, 10);
            ctx.fillRect(x+15, y-5, 10, 10);
        }

        // Малювання кота (перешкода)
        function drawCat(x, y) {
            ctx.fillStyle = 'black';
            ctx.fillRect(x, y, 30, 20); // Тіло
            ctx.fillRect(x + 20, y - 10, 10, 10); // Голова
            ctx.fillStyle = 'green';
            ctx.fillRect(x + 25, y - 5, 2, 2); // Око
        }

        function spawnObstacle() {
            if (isGameOver) return;
            obstacles.push({ x: canvas.width, y: canvas.height - 50, w: 30, h: 20 });
            setTimeout(spawnObstacle, 1500 + Math.random() * 2000);
        }

        function spawnBone() {
            if (isGameOver) return;
            bones.push({ x: canvas.width, y: canvas.height - 150, w: 20, h: 10 });
            setTimeout(spawnBone, 1000 + Math.random() * 1500);
        }

        function update() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Гравітація пса
            dog.dy += gravity;
            dog.y += dog.dy;
            if (dog.y + dog.h > canvas.height - 30) {
                dog.y = canvas.height - 30 - dog.h;
                dog.dy = 0;
                dog.grounded = true;
            }

            drawDog(dog.x, dog.y);

            // Перешкоди
            obstacles.forEach((obs, i) => {
                obs.x -= gameSpeed;
                drawCat(obs.x, obs.y);
                if (dog.x < obs.x + obs.w && dog.x + dog.w > obs.x && dog.y < obs.y + obs.h && dog.y + dog.h > obs.y) {
                    isGameOver = true;
                    alert("Game Over! Bones: " + score);
                    location.reload();
                }
            });

            // Кістки
            bones.forEach((b, i) => {
                b.x -= gameSpeed;
                drawBone(b.x, b.y);
                if (dog.x < b.x + b.w && dog.x + dog.w > b.x && dog.y < b.y + b.h && dog.y + dog.h > b.y) {
                    score++;
                    scoreElement.innerText = "Bones: " + score;
                    bones.splice(i, 1);
                }
            });

            gameSpeed += 0.001;
            requestAnimationFrame(update);
        }

        window.addEventListener('touchstart', () => { if (dog.grounded) { dog.dy = -dog.jump; dog.grounded = false; } });
        window.addEventListener('mousedown', () => { if (dog.grounded) { dog.dy = -dog.jump; dog.grounded = false; } });

        spawnObstacle();
        spawnBone();
        update();
    </script>
</body>
</html>
