<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beagle Run</title>
<style>
html,body{
margin:0;
padding:0;
background:#1a1a1a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}
canvas{
background:#87CEEB;
width:100vw;
height:56.25vw;
max-height:100vh;
max-width:177.78vh;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=1280;
canvas.height=720;

const groundHeight=130;
const groundY=canvas.height-groundHeight;

/* ==== IMAGES ==== */
const imgDog=new Image(); imgDog.src="1124-removebg-preview.png";
const imgCat=new Image(); imgCat.src="1126-removebg-preview.png";
const imgHouse=new Image(); imgHouse.src="1128-removebg-preview.png";
const imgBone=new Image(); imgBone.src="1127-removebg-preview.png";

/* ==== GAME ==== */
let score=0;
let best=localStorage.getItem("beagleBest")||0;
let speed=9;
let spawnTimer=0;
let gameOver=false;
let waiting=true;

/* ==== DOG ==== */
const dog={
x:150,
w:150,
h:150,
y:groundY-150,
dy:0,
gravity:1.4,
jumpPower:28,
grounded:true,

/* HITBOX */
hit:{
offsetX:35,
offsetY:40,
width:80,
height:90
}
};

let obstacles=[];
let bones=[];

/* ===== LOOP ===== */

function loop(){
ctx.clearRect(0,0,canvas.width,canvas.height);

/* SKY */
ctx.fillStyle="#87CEEB";
ctx.fillRect(0,0,canvas.width,canvas.height);

/* GROUND */
ctx.fillStyle="#3c8d0d";
ctx.fillRect(0,groundY,canvas.width,groundHeight);

if(waiting){
ctx.fillStyle="rgba(0,0,0,0.6)";
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="white";
ctx.font="bold 50px sans-serif";
ctx.textAlign="center";
ctx.fillText("TAP TO START",canvas.width/2,350);
requestAnimationFrame(loop);
return;
}

if(!gameOver){

/* PHYSICS */
dog.dy+=dog.gravity;
dog.y+=dog.dy;

if(dog.y+dog.h>=groundY){
dog.y=groundY-dog.h;
dog.dy=0;
dog.grounded=true;
}

ctx.drawImage(imgDog,dog.x,dog.y,dog.w,dog.h);

/* SPAWN */
spawnTimer++;
if(spawnTimer>95){

const w=130;
const h=130;

/* ВИРІВНЮВАННЯ ПО ВІЗУАЛЬНОМУ НИЗУ */
const visualOffset=35; // зменшує "висіння"
const y=groundY-h+visualOffset;

obstacles.push({
x:canvas.width,
y:y,
w:w,
h:h,
type:Math.random()>0.5?"cat":"house",

hit:{
offsetX:30,
offsetY:50,
width:70,
height:80
}
});

/* ПОДВІЙНИЙ — ближче */
if(Math.random()<0.4){
obstacles.push({
x:canvas.width+60,
y:y,
w:w,
h:h,
type:Math.random()>0.5?"cat":"house",
hit:{
offsetX:30,
offsetY:50,
width:70,
height:80
}
});
}

spawnTimer=0;
}

/* OBSTACLES */
obstacles.forEach(o=>{
o.x-=speed;
ctx.drawImage(
o.type==="cat"?imgCat:imgHouse,
o.x,o.y,o.w,o.h
);

/* COLLISION USING HITBOX */
if(checkCollision(dog,o)){
gameOver=true;
if(score>best){
best=score;
localStorage.setItem("beagleBest",best);
}
}
});

obstacles=obstacles.filter(o=>o.x>-200);

/* TEXT */
ctx.fillStyle="white";
ctx.font="bold 30px sans-serif";
ctx.textAlign="left";
ctx.fillText("Bones: "+score,40,50);
ctx.textAlign="right";
ctx.fillText("Best: "+best,canvas.width-40,50);

}else{
ctx.fillStyle="rgba(0,0,0,0.7)";
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="white";
ctx.font="bold 50px sans-serif";
ctx.textAlign="center";
ctx.fillText("GAME OVER",canvas.width/2,320);
ctx.font="30px sans-serif";
ctx.fillText("Tap to Restart",canvas.width/2,380);
}

requestAnimationFrame(loop);
}

/* ==== COLLISION ==== */
function checkCollision(d,o){

const dX=d.x+d.hit.offsetX;
const dY=d.y+d.hit.offsetY;
const dW=d.hit.width;
const dH=d.hit.height;

const oX=o.x+o.hit.offsetX;
const oY=o.y+o.hit.offsetY;
const oW=o.hit.width;
const oH=o.hit.height;

return(
dX<oX+oW &&
dX+dW>oX &&
dY<oY+oH &&
dY+dH>oY
);
}

/* ==== INPUT ==== */
function input(){

if(waiting){waiting=false;return;}

if(gameOver){
score=0;
obstacles=[];
gameOver=false;
dog.y=groundY-dog.h;
return;
}

if(dog.grounded){
dog.dy=-dog.jumpPower;
dog.grounded=false;
}
}

window.addEventListener("touchstart",e=>{
e.preventDefault();
input();
},{passive:false});

window.addEventListener("mousedown",input);

loop();
</script>
</body>
</html>
