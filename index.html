<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beagle Run - Leaderboard Edition</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; }
        canvas { display: block; background: #87CEEB; touch-action: none; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        
        #ui { 
            position: absolute; top: 20px; width: 100%; text-align: center; 
            color: white; font-family: 'Arial', sans-serif; font-size: 24px; font-weight: bold; 
            text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; 
        }

        #game-over {
            position: absolute; display: none; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.7); color: white; font-family: sans-serif;
            width: 100%; height: 100%; z-index: 20; text-align: center;
        }
        #game-over h1 { font-size: 48px; margin: 10px; color: #ff4d4d; }
        #game-over p { font-size: 24px; margin: 5px; }
        #game-over .hint { font-size: 16px; color: #aaa; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="ui">Bones: 0 | Best: 0</div>
    
    <div id="game-over">
        <h1>GAME OVER</h1>
        <p id="final-score">Score: 0</p>
        <p id="high-score" style="color: #ffd700;">Record: 0</p>
        <p class="hint">Tap anywhere to Restart</p>
    </div>

    <canvas id="game"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('ui');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreText = document.getElementById('final-score');
        const highScoreText = document.getElementById('high-score');

        function resize() {
            const ratio = 16 / 9;
            let w = window.innerWidth;
            let h = window.innerHeight;
            if (w / h > ratio) { w = h * ratio; } else { h = w / ratio; }
            canvas.width = w; canvas.height = h;
        }
        window.addEventListener('resize', resize);
        resize();

        // Завантаження ресурсів
        const imgDog = new Image(); imgDog.src = 'dog.png'; 
        const imgCat = new Image(); imgCat.src = 'cat.png';
        const imgBone = new Image(); imgBone.src = 'bone.png';
        const imgHouse = new Image(); imgHouse.src = 'house.png';

        let score = 0;
        let highScore = localStorage.getItem('beagleHighScore') || 0;
        let gameSpeed = 5;
        let isGameOver = false;
        const gravity = 0.6;
        
        let dog = { x: 50, y: 0, w: 60, h: 60, dy: 0, jump: 12, grounded: false };
        let obstacles = [];
        let bones = [];
        let clouds = [];

        // Оновлюємо UI на початку
        scoreElement.innerText = `Bones: 0 | Best: ${highScore}`;

        function createCloud() {
            return { x: canvas.width + Math.random() * 200, y: Math.random() * (canvas.height * 0.4), w: 60, h: 30, speed: 0.5 + Math.random() };
        }

        for(let i=0; i<5; i++) {
            let c = createCloud(); c.x = Math.random() * canvas.width; clouds.push(c);
        }

        function spawn() {
            if (isGameOver) return;
            if (Math.random() < 0.01) {
                obstacles.push({ x: canvas.width, y: canvas.height * 0.85 - 55, w: 55, h: 55, type: Math.random() > 0.5 ? 'cat' : 'house' });
            }
            if (Math.random() < 0.015) {
                bones.push({ x: canvas.width, y: canvas.height * 0.4 + Math.random() * 100, w: 35, h: 25 });
            }
            setTimeout(spawn, 100);
        }

        function update() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Хмари
            ctx.fillStyle = "white";
            clouds.forEach(c => {
                c.x -= c.speed;
                ctx.beginPath();
                ctx.arc(c.x, c.y, 20, 0, Math.PI * 2);
                ctx.arc(c.x + 20, c.y - 10, 25, 0, Math.PI * 2);
                ctx.arc(c.x + 45, c.y, 20, 0, Math.PI * 2);
                ctx.fill();
                if (c.x + 100 < 0) { Object.assign(c, createCloud()); c.x = canvas.width; }
            });

            // Земля
            ctx.fillStyle = '#458B00';
            ctx.fillRect(0, canvas.height * 0.85, canvas.width, canvas.height * 0.15);

            // Собака
            dog.dy += gravity;
            dog.y += dog.dy;
            if (dog.y + dog.h > canvas.height * 0.85) {
                dog.y = canvas.height * 0.85 - dog.h;
                dog.dy = 0;
                dog.grounded = true;
            }
            ctx.drawImage(imgDog, dog.x, dog.y, dog.w, dog.h);

            // Перешкоди
            obstacles.forEach((obs, i) => {
                obs.x -= gameSpeed;
                ctx.drawImage(obs.type === 'cat' ? imgCat : imgHouse, obs.x, obs.y, obs.w, obs.h);
                
                if (dog.x < obs.x + obs.w - 15 && dog.x + dog.w > obs.x + 15 && dog.y < obs.y + obs.h - 10 && dog.y + dog.h > obs.y + 10) {
                    endGame();
                }
                if (obs.x + obs.w < 0) obstacles.splice(i, 1);
            });

            // Кістки
            bones.forEach((b, i) => {
                b.x -= gameSpeed;
                ctx.drawImage(imgBone, b.x, b.y, b.w, b.h);
                if (dog.x < b.x + b.w && dog.x + dog.w > b.x && dog.y < b.y + b.h && dog.y + dog.h > b.y) {
                    score++;
                    scoreElement.innerText = `Bones: ${score} | Best: ${highScore}`;
                    bones.splice(i, 1);
                }
            });

            gameSpeed += 0.001;
            requestAnimationFrame(update);
        }

        function endGame() {
            isGameOver = true;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('beagleHighScore', highScore);
            }
            finalScoreText.innerText = `Score: ${score}`;
            highScoreText.innerText = `Record: ${highScore}`;
            gameOverScreen.style.display = 'flex';
        }

        function resetGame() {
            score = 0;
            gameSpeed = 5;
            isGameOver = false;
            obstacles = [];
            bones = [];
            dog.y = 0;
            dog.dy = 0;
            scoreElement.innerText = `Bones: 0 | Best: ${highScore}`;
            gameOverScreen.style.display = 'none';
            update();
        }

        const handleAction = () => { 
            if (isGameOver) { resetGame(); }
            else if (dog.grounded) { dog.dy = -dog.jump; dog.grounded = false; } 
        };

        window.addEventListener('touchstart', (e) => { handleAction(); e.preventDefault(); }, {passive: false});
        window.addEventListener('mousedown', handleAction);

        spawn();
        update();
    </script>
</body>
</html>
